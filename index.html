<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkle Clean | Instant Quote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- TODO: Replace with DynamoDB-backed visitor counter -->
  <div class="visitor-counter">
    <span>👁️ Visitors: <strong id="visit-count">Loading...</strong></span>
  </div>

  <div class="container">
    <header>
      <h1>Sparkle Clean Services</h1>
      <p>Get an instant estimate for your home cleaning</p>
    </header>

    <!-- TODO: Form submission will POST to your API Gateway endpoint -->
    <form id="quote-form">
      
      <!-- Service Details -->
      <fieldset class="form-section">
        <legend>Service Details</legend>
        
        <div class="form-group">
          <label for="rooms">Number of Rooms *</label>
          <input type="number" id="rooms" name="rooms" value="1" min="1" required>
        </div>

        <div class="form-group">
          <label for="service-type">Service Type *</label>
          <select id="service-type" name="service_type" required>
            <option value="standard">Standard Clean ($50/room)</option>
            <option value="deep">Deep Clean ($80/room)</option>
            <option value="move">Move In/Out ($100/room)</option>
          </select>
        </div>
         
        <div class="form-group">
          <label>Extras</label>
          <div class="checkbox-group">
            <label>
              <input type="checkbox" class="extra" name="extras" value="20"> Windows ($20)
            </label>
            <label>
              <input type="checkbox" class="extra" name="extras" value="30"> Carpets ($30)
            </label>  
          </div>
        </div>
      </fieldset>

      <!-- Contact Details for Backend Follow-up -->
      <fieldset class="form-section">
        <legend>Contact Information *</legend>
        
        <div class="form-group">
          <label for="full-name">Full Name *</label>
          <input type="text" id="full-name" name="full_name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone *</label>
          <input type="tel" id="phone" name="phone" required placeholder="+27...">
        </div>

        <div class="form-group">
          <label for="address">Service Address *</label>
          <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
          <label for="preferred-contact">Preferred Contact *</label>
          <select id="preferred-contact" name="preferred_contact" required>
            <option value="phone">Phone</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="email">Email</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2"></textarea>
        </div>
      </fieldset>

      <!-- Quote Summary -->
      <div class="total-section">
        <span>Estimated Total</span>
        <strong id="total-price">$0.00</strong>
      </div>
      
      <!-- Hidden field for calculated total -->
      <input type="hidden" id="quote-total" name="quote_total">
      
      <button type="submit" id="submit-btn">Book This Price</button>
      <p class="form-note">* Required. We'll contact you within 24 hours.</p>
    </form>
    
    <!-- TODO: Add success/error message container for API responses -->
    <div id="form-message" class="form-message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
